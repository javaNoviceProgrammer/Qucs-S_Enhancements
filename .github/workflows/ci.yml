# A trial, on a ci/ branch only: past finds of the sanitized job put back (each
# behind its own QUCS_BREAK_n), at the job's flags now and at the proposed ones.
# Not for main (docs/proposals/2026-11-05-linux-ci-time.md).
name: CI

on:
  push:
  workflow_dispatch:

env:
  SRC_DIR: qucs-s-26.1.1
  QT_VERSION: 6.10.3

jobs:
  breaks:
    name: breaks ${{ matrix.debug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        debug: ['-O0 -g', '-O1 -g1 -U_FORTIFY_SOURCE']
    steps:
      - uses: actions/checkout@v4

      - name: Room on the disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gperf dos2unix \
            libglx-dev libgl1-mesa-dev libcups2-dev zlib1g-dev \
            ngspice fonts-dejavu-core

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts qtpdf
          cache: true
          install-deps: true

      - name: Swap for the build
        run: |
          sudo fallocate -l 8G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci > /dev/null
          sudo swapon /swapfile-ci

      - name: Configure
        run: |
          cmake -S "$SRC_DIR" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS_DEBUG="${{ matrix.debug }}" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DQUCS_SHARED_TEST_CORE=ON \
            -DQUCS_TEST_TIMEOUT_SCALE=3 \
            -DGIT="${GITHUB_SHA::7}"

      - name: Build
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cmake --build build --parallel --target $(cat scripts/ci/break-targets.txt)

      - name: The finds put back
        run: bash scripts/ci/break-run.sh build/qucs/tests
