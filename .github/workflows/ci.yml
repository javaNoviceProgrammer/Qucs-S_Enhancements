# Continuous integration: a Debug build instrumented with AddressSanitizer and
# UndefinedBehaviorSanitizer, then the QtTest unit tests (qucs/tests) and the
# headless smoke tests over the shipped examples (scripts/ci/smoke-test.sh),
# on Linux; plus Release builds on macOS (with the unit tests) and Windows
# (MSYS2), so a platform break shows on the push that made it and not on
# release day (WS2.1 of ENHANCEMENT_PROPOSAL.md). Release packaging for all
# platforms lives in release.yml.
name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'bin/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'bin/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SRC_DIR: qucs-s-26.1.1
  # Never use the distro Qt on Ubuntu 24.04 (6.4.2): its QProcess crashes on
  # every start because of the forkfd_pidfd bug (upstream #1543, QTBUG-98951).
  QT_VERSION: 6.10.3

jobs:
  linux-asan:
    name: Linux · Debug + ASan/UBSan · smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # A Debug build under ASan links every test against all of qucs-core,
      # each with its debug info: some 95 executables outgrew the runner's
      # free disk ("No space left on device" at link, October 2026). The
      # runner's preinstalled SDKs, none of which this job uses, make room.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      # Before the build, in a second: every argument a Claude tool reads is
      # in its schema - a call with one it lacks is refused - and the other
      # way round (see scripts/ci/check-tool-arguments.py).
      - name: Claude's tools take what they read
        run: python3 scripts/ci/check-tool-arguments.py

      # No list of one list written as QJsonArray{QJsonArray{...}}: a copy
      # to Apple's newer clang, a nesting to the others (see
      # scripts/ci/check-json-nesting.py).
      - name: Lists of one list are nested on every compiler
        run: python3 scripts/ci/check-json-nesting.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gperf dos2unix \
            libglx-dev libgl1-mesa-dev libcups2-dev zlib1g-dev \
            ngspice fonts-dejavu-core
          ngspice --version | sed -n '2p'

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts qtpdf
          cache: true
          install-deps: true

      # The tests share one library of the core (QUCS_SHARED_TEST_CORE):
      # each linking its own copy, with this build's debug info, came to
      # 89 GB.
      - name: Configure (Debug, ASan + UBSan)
        run: |
          cmake -S "$SRC_DIR" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DQUCS_SHARED_TEST_CORE=ON \
            -DGIT="${GITHUB_SHA::7}"

      - name: Build
        # The build runs the freshly built qucsator_rf to generate
        # qucsdefs.h; LeakSanitizer (on by default on Linux) would fail it.
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cmake --build build --parallel

      # How much room the build left, and what takes it: the next growth
      # shows here first.
      - name: Disk left after the build
        run: |
          df -h /
          du -sh build
          du -sh build/qucs/tests build/qucs/CMakeFiles build/qucsator_rf 2>/dev/null || true
          find build/qucs/tests -maxdepth 1 -type f \( -perm -u+x -o -name '*.so' \) -printf '%s %p\n' \
            | sort -n | awk '{ total += $1 } END { printf "tests and their library: %d files, %.1f GB\n", NR, total / 2^30 }
                            { last = $0 } END { print "largest: " last }' 

      - name: Unit tests (QtTest, headless)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test · load and render every ngspice example
        run: scripts/ci/smoke-test.sh load build/qucs/qucs-s "$SRC_DIR/examples" smoke-out

      - name: Smoke test · netlist → ngspice → dataset → render
        run: scripts/ci/smoke-test.sh simulate build/qucs/qucs-s "$SRC_DIR/examples" smoke-out

      # Regression guard for the dataset-loader crashes fixed in WS1.1
      # (ENHANCEMENT_PROPOSAL.md §1.2): blocking, must stay green.
      - name: Smoke test · hostile datasets
        run: scripts/ci/smoke-test.sh hostile build/qucs/qucs-s "$SRC_DIR/examples" smoke-out

      # Damaged schematics and datasets through the loader, netlister and
      # renderer; the simulate suite's work directory supplies schematics
      # with real ngspice datasets next to them. A fixed seed makes the run
      # reproducible; failures keep the mutant under smoke-out/fuzz/findings/
      # (see scripts/ci/fuzz-sch.py).
      - name: Fuzz · mutated example schematics and datasets
        run: python3 scripts/ci/fuzz-sch.py build/qucs/qucs-s "$SRC_DIR/examples" smoke-out/fuzz --count 150 --seed 1 --timeout 120 --extra smoke-out/simulate/work

      # Damaged ngspice output (the raw files the simulate suite stashed)
      # through the parsers behind every "Simulate" click, via the harness
      # in qucs/tests/simout_harness.cpp.
      - name: Fuzz · mutated simulator output
        run: python3 scripts/ci/fuzz-simout.py build/qucs/tests/simout_harness smoke-out/simulate/work smoke-out/fuzz-simout --count 150 --seed 1 --timeout 120

      # The same into binary datasets (datasetfile.h): a raw file's header
      # read, its values taken whole when it is a plain one.
      - name: Fuzz · mutated simulator output into binary datasets
        env:
          QUCS_DATASET_FORMAT: binary
        run: python3 scripts/ci/fuzz-simout.py build/qucs/tests/simout_harness smoke-out/simulate/work smoke-out/fuzz-simout-binary --count 100 --seed 2 --timeout 120

      - name: Upload smoke-test logs and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: |
            smoke-out/**/*.log
            smoke-out/**/*.png
            smoke-out/fuzz/findings/**
            smoke-out/fuzz-simout/findings/**
            smoke-out/fuzz-simout-binary/findings/**
          retention-days: 14
          if-no-files-found: ignore

  macos-build:
    name: macOS · Release build · unit tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtcharts qtpdf
          cache: true

      - name: Install build dependencies
        run: |
          brew install ninja gperf dos2unix bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin"  >> "$GITHUB_PATH"

      - name: Configure (Release)
        run: |
          cmake -S "$SRC_DIR" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGIT="${GITHUB_SHA::7}"

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests (QtTest, headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  windows-build:
    name: Windows · Release build (MSYS2 ucrt64)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep LF line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - name: Set up MSYS2 (ucrt64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          cache: true
          install: bison flex dos2unix
          pacboy: cmake:p gcc:p qt6-base:p qt6-tools:p qt6-svg:p qt6-charts:p qt6-pdf:p qt6-declarative:p make:p ninja:p gperf:p zlib:p

      - name: Configure and build (Release)
        run: |
          cmake -S "$SRC_DIR" -B "$SRC_DIR/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGIT="${GITHUB_SHA::7}"
          cmake --build "$SRC_DIR/build" --parallel

      - name: Bundle as the release does, and check it as a PC without MSYS2 runs it
        timeout-minutes: 30
        # A DLL the bundle lacks shows here, on the push that made it - not
        # on a user's first start (26.1.3 shipped without Qt6Network.dll).
        run: |
          cmake --install "$SRC_DIR/build" --prefix "$SRC_DIR/build/qucs-suite"
          bash scripts/ci/windows-bundle.sh deploy "$SRC_DIR/build/qucs-suite/bin" ucrt64
          bash scripts/ci/windows-bundle.sh check "$SRC_DIR/build/qucs-suite/bin" ucrt64 "$SRC_DIR/examples/ngspice/General Electronics/RC_filter_FFT.sch"
