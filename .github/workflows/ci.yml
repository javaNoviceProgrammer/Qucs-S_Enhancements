# A trial, on a ci/ branch only: which of the sanitized job's kinds of defect
# each optimization level still catches, with the job's compiler.
name: CI
on:
  push:
  workflow_dispatch:
jobs:
  canary:
    name: canary ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: The compiler
        run: |
          g++ --version | head -1
          lscpu | sed -n '1,20p'
      - name: Canary
        run: bash scripts/ci/canary.sh g++ scripts/ci/canary.cpp "-O0 -g" "-O1 -g1" "-O1 -g1 -U_FORTIFY_SOURCE" "-Og -g1 -U_FORTIFY_SOURCE" "-O2 -g1 -U_FORTIFY_SOURCE"
