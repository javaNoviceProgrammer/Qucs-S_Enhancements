# A trial, on a ci/ branch only: what the sanitized Linux job's time is made of
# (docs/proposals/2026-11-05-linux-ci-time.md). Not for main: main's ci.yml has
# the three platforms' jobs.
name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - 'bin/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SRC_DIR: qucs-s-26.1.1
  QT_VERSION: 6.10.3

jobs:
  sanitized:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          # The whole job, as main's.
          - { label: 'x86 O1 g1 full', os: ubuntu-24.04, qt_host: linux, qt_arch: linux_gcc_64, debug: '-O1 -g1', full: true, ccache: false }
          - { label: 'x86 Og g1 full', os: ubuntu-24.04, qt_host: linux, qt_arch: linux_gcc_64, debug: '-Og -g1', full: true, ccache: false }
          - { label: 'arm O1 g1 full', os: ubuntu-24.04-arm, qt_host: linux_arm64, qt_arch: linux_gcc_arm64, debug: '-O1 -g1', full: true, ccache: false }
          - { label: 'arm O0 g full', os: ubuntu-24.04-arm, qt_host: linux_arm64, qt_arch: linux_gcc_arm64, debug: '-O0 -g', full: true, ccache: false }
          # The build alone: debug info's share of it, and what ccache keeps.
          - { label: 'x86 O0 g1 build', os: ubuntu-24.04, qt_host: linux, qt_arch: linux_gcc_64, debug: '-O0 -g1', full: false, ccache: false }
          - { label: 'x86 O0 g ccache', os: ubuntu-24.04, qt_host: linux, qt_arch: linux_gcc_64, debug: '-O0 -g', full: false, ccache: true }
          - { label: 'x86 O1 g1 ccache', os: ubuntu-24.04, qt_host: linux, qt_arch: linux_gcc_64, debug: '-O1 -g1', full: false, ccache: true }
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CCACHE_MAXSIZE: 40G
    steps:
      - uses: actions/checkout@v4

      - name: The machine
        run: |
          lscpu
          nproc
          free -h
          df -h / /mnt 2>/dev/null || true

      - name: Room on the disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gperf dos2unix \
            libglx-dev libgl1-mesa-dev libcups2-dev zlib1g-dev \
            ngspice fonts-dejavu-core ccache zstd
          ngspice --version | sed -n '2p'
          gcc --version | head -1
          ccache --version | head -1

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtcharts qtpdf
          cache: true
          install-deps: true

      - name: Swap for the build
        run: |
          free -h
          df -h / /mnt 2>/dev/null || true
          target=/swapfile-ci
          disk=/
          reserve=15
          if [ -d /mnt ] && [ "$(stat -c %d /mnt)" != "$(stat -c %d /)" ]; then
            target=/mnt/swapfile-ci
            disk=/mnt
            reserve=0
          fi
          avail=$(df --output=avail -BG "$disk" | tail -1 | tr -dc 0-9)
          size=$(( avail - reserve ))
          if [ "$size" -gt 8 ]; then size=8; fi
          if [ "$size" -ge 1 ]; then
            echo "${size} GB of swap at $target (${avail} GB free on $disk)"
            sudo fallocate -l "${size}G" "$target"
            sudo chmod 600 "$target"
            sudo mkswap "$target" > /dev/null
            sudo swapon "$target"
          else
            echo "No swap added: ${avail} GB free on $disk, ${reserve} GB of it the build's"
          fi
          free -h

      # The least memory left, every 20 s, from here to the job's end.
      - name: Watch the memory
        run: |
          nohup bash -c 'while :; do echo "$(date +%T) $(awk "/^MemAvailable|^SwapFree/{print \$2}" /proc/meminfo | xargs)"; sleep 20; done' > "$RUNNER_TEMP/mem.log" 2>&1 &
          disown

      - name: Configure
        run: |
          launcher=""
          if [ "${{ matrix.ccache }}" = "true" ]; then launcher="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"; fi
          cmake -S "$SRC_DIR" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS_DEBUG="${{ matrix.debug }}" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DQUCS_SHARED_TEST_CORE=ON \
            -DQUCS_TEST_TIMEOUT_SCALE=3 \
            -DGIT="${GITHUB_SHA::7}" $launcher

      - name: Build
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          cat /proc/stat | head -1
          cmake --build build --parallel
          cat /proc/stat | head -1

      - name: After the build
        run: |
          free -h
          df -h /
          du -sh build
          du -sh build/qucs/tests build/qucs/CMakeFiles build/qucsator_rf 2>/dev/null || true
          find build/qucs/tests -maxdepth 1 -type f \( -perm -u+x -o -name '*.so' \) -printf '%s %p\n' \
            | sort -n | awk '{ total += $1 } END { printf "tests and their library: %d files, %.1f GB\n", NR, total / 2^30 }
                            { last = $0 } END { print "largest: " last }'
          find build -name '*.o' -printf '%s\n' | awk '{ t += $1 } END { printf "objects: %d, %.1f GB\n", NR, t / 2^30 }'
          find build -name '*.a' -printf '%s\n' | awk '{ t += $1 } END { printf "archives: %d, %.1f GB\n", NR, t / 2^30 }'
          echo "least available and swap free, in kB:"
          sort -k2 -n "$RUNNER_TEMP/mem.log" | head -1
          sort -k3 -n "$RUNNER_TEMP/mem.log" | head -1
          if [ "${{ matrix.ccache }}" = "true" ]; then ccache -s -v; du -sh "$CCACHE_DIR"; fi

      - name: Every object from the cache, nothing linked yet
        if: ${{ matrix.ccache }}
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          rm -rf build
          launcher="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          cmake -S "$SRC_DIR" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS_DEBUG="${{ matrix.debug }}" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DQUCS_SHARED_TEST_CORE=ON \
            -DQUCS_TEST_TIMEOUT_SCALE=3 \
            -DGIT="trial01" $launcher > /dev/null
          ccache -z
          SECONDS=0
          cmake --build build --parallel
          echo "the build again from the cache: $SECONDS s"
          ccache -s -v
          du -sh "$CCACHE_DIR"
          tar -C "$CCACHE_DIR/.." -cf - .ccache | zstd -T0 -1 | wc -c

      - name: What the tests would need, packed
        if: ${{ !matrix.ccache }}
        run: |
          SECONDS=0
          tar --exclude='*.o' --exclude='*.a' -cf - build | zstd -T0 -3 | wc -c
          echo "packed in $SECONDS s"

      # What the sanitizers' run-time options cost, on one test alone.
      - name: The run-time options
        if: ${{ !matrix.full }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ASAN_OPTIONS=help=1 build/qucs/tests/test_fem_physics 2>&1 | grep -E -A1 'detect_stack_use_after_return|malloc_context_size|^\s*quarantine_size_mb|max_uar_stack_size_log|min_uar_stack_size_log' || true
          t=build/qucs/tests/test_fem_physics
          for o in detect_leaks=0 \
                   detect_leaks=0:detect_stack_use_after_return=0 \
                   detect_leaks=0:malloc_context_size=5 \
                   detect_leaks=0:detect_stack_use_after_return=0:malloc_context_size=5 \
                   detect_leaks=0; do
            SECONDS=0
            ASAN_OPTIONS=$o UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 "$t" > /dev/null 2>&1
            echo "$o: rc=$? $SECONDS s"
          done

      - name: Unit tests (QtTest, headless)
        if: ${{ matrix.full }}
        run: |
          echo "$(nproc) processors: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
          cat /proc/stat | head -1
          ctest --test-dir build --output-on-failure --parallel "$(nproc)"
          cat /proc/stat | head -1

      - name: Memory the tests left
        if: ${{ always() && matrix.full }}
        run: |
          cat /proc/stat | head -1
          echo "least available and swap free, in kB:"
          sort -k2 -n "$RUNNER_TEMP/mem.log" | head -1
          sort -k3 -n "$RUNNER_TEMP/mem.log" | head -1
          df -h /

      - name: Smoke test · load and render every ngspice example
        if: ${{ always() && matrix.full }}
        run: scripts/ci/smoke-test.sh load build/qucs/qucs-s "$SRC_DIR/examples" smoke-out

      - name: Smoke test · netlist → ngspice → dataset → render
        if: ${{ always() && matrix.full }}
        run: scripts/ci/smoke-test.sh simulate build/qucs/qucs-s "$SRC_DIR/examples" smoke-out

      - name: Smoke test · hostile datasets
        if: ${{ always() && matrix.full }}
        run: scripts/ci/smoke-test.sh hostile build/qucs/qucs-s "$SRC_DIR/examples" smoke-out

      - name: Fuzz · mutated example schematics and datasets
        if: ${{ always() && matrix.full }}
        run: python3 scripts/ci/fuzz-sch.py build/qucs/qucs-s "$SRC_DIR/examples" smoke-out/fuzz --count 150 --seed 1 --timeout 120 --extra smoke-out/simulate/work

      - name: Fuzz · mutated simulator output
        if: ${{ always() && matrix.full }}
        run: python3 scripts/ci/fuzz-simout.py build/qucs/tests/simout_harness smoke-out/simulate/work smoke-out/fuzz-simout --count 150 --seed 1 --timeout 120

      - name: Fuzz · mutated simulator output into binary datasets
        if: ${{ always() && matrix.full }}
        env:
          QUCS_DATASET_FORMAT: binary
        run: python3 scripts/ci/fuzz-simout.py build/qucs/tests/simout_harness smoke-out/simulate/work smoke-out/fuzz-simout-binary --count 100 --seed 2 --timeout 120

  # The build handed to another runner: what a split job would pay.
  hand-over-build:
    name: Hand over · build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Room on the disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gperf dos2unix \
            libglx-dev libgl1-mesa-dev libcups2-dev zlib1g-dev \
            ngspice fonts-dejavu-core zstd

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts qtpdf
          cache: true
          install-deps: true

      - name: Swap for the build
        run: |
          sudo fallocate -l 8G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci > /dev/null
          sudo swapon /swapfile-ci

      - name: Configure
        run: |
          cmake -S "$SRC_DIR" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS_DEBUG="-O1 -g1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DQUCS_SHARED_TEST_CORE=ON \
            -DQUCS_TEST_TIMEOUT_SCALE=3 \
            -DGIT="${GITHUB_SHA::7}"

      - name: Build
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: cmake --build build --parallel

      - name: Pack
        run: |
          tar --exclude='*.o' --exclude='*.a' -cf - build | zstd -T0 -3 > build.tar.zst
          ls -la build.tar.zst

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-build
          path: build.tar.zst
          compression-level: 0
          retention-days: 1

  hand-over-tests:
    name: Hand over · tests
    needs: hand-over-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglx-dev libgl1-mesa-dev libcups2-dev zlib1g-dev \
            ngspice fonts-dejavu-core zstd

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts qtpdf
          cache: true
          install-deps: true

      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: sanitized-build

      - name: Unpack
        run: |
          zstd -d -c build.tar.zst | tar -xf -
          du -sh build
          rm build.tar.zst

      - name: Tests of each kind
        run: ctest --test-dir build --output-on-failure --parallel 4 -R '^(test_fem_physics|test_rf25_model|test_markdown_doc|test_mcp_server|test_python_tools|test_library_export|test_build_commit)$'

      - name: Smoke test · hostile datasets
        run: scripts/ci/smoke-test.sh hostile build/qucs/qucs-s "$SRC_DIR/examples" smoke-out
